name: Unit Tests
on:
  pull_request:

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      - name: Prepare and run tests
        run: |
          ls -lah
          npm install
          npm run test

      - name: debug
        run: ls -lah